zhenshi_driver:
  ros__parameters:
    robot_ip: "192.168.11.11"
    model_index: 0
    model_count: 2
    # The connected controller reports 7 real joints per model. The official
    # MoveAbsJ command format still reserves 10 slots, so the last 3 are padded.
    joint_count: 7
    command_joint_slots: 10
    joint_speed_value: 0.01
    max_joint_step_rad: 0.008726646259971648  # 0.5 degree
    state_publish_hz: 10.0
    rpc_timeout_ms: 5000

    # Safe default. Real mode must be explicitly enabled at launch time.
    dry_run: true
    allow_raw_commands: false
    sdk_root: ""

    # Initial bounds copied from the old dry-run project, converted mm -> m.
    # Tighten these after new hand-eye calibration.
    workspace_min_m: [0.0, -0.7, -0.3]
    workspace_max_m: [1.0, 0.7, 0.5]
